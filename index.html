<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuckyPay - Wallet</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto}
body{background:#0f172a;color:#fff;min-height:100vh}
.header{background:linear-gradient(135deg,#6366f1,#8b5cf6);padding:20px;border-radius:0 0 24px 24px}
.balance-card{background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);padding:20px;border-radius:16px;margin-top:15px}
.balance-label{font-size:14px;opacity:0.8}
.balance-amount{font-size:32px;font-weight:700;margin:8px 0}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:20px}
.action-btn{background:#1e293b;padding:16px;border-radius:12px;text-align:center;border:none;color:#fff;cursor:pointer}
.action-btn span{font-size:24px;display:block;margin-bottom:6px}
.transactions{padding:20px}
.tx-item{background:#1e293b;padding:14px;border-radius:10px;margin-bottom:10px;display:flex;justify-content:space-between}
.positive{color:#22c55e}
.btn-primary{background:#6366f1;color:#fff;border:none;padding:12px 20px;border-radius:10px;width:100%;margin-top:10px}
</style>
</head>
<body>
<div class="header">
<h2>💜 LuckyPay</h2>
<p>Welcome back, ThankGod!</p>
<div class="balance-card">
<div class="balance-label">Available Balance</div>
<div class="balance-amount">₦10,000.00</div>
<div style="font-size:12px;opacity:0.7">Account: 812 345 6789 • Verified</div>
</div>
</div>
<div class="actions">
<button class="action-btn"><span>💸</span>Send</button>
<button class="action-btn"><span>📱</span>Airtime</button>
<button class="action-btn"><span>💡</span>Bills</button>
</div>
<div class="transactions">
<h3 style="margin-bottom:12px">Recent Transactions</h3>
<div class="tx-item"><div><b>Welcome Bonus</b><br><small>Today • Credit</small></div><div class="positive">+₦10,000</div></div>
<div class="tx-item"><div><b>LuckyPay Wallet</b><br><small>Account Created</small></div><div>—</div></div>
<button class="btn-primary">Refresh Balance</button>
<p style="text-align:center;margin-top:20px;opacity:0.5;font-size:12px">LuckyPay v2.0 • Secure & Fast</p>
</div>
</body>
                            </html>
